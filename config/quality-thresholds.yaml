# Target Code Coverage Thresholds
# These apply to critical packages only

thresholds:
  libs/domain:
    statements: 90
    branches: 85
    functions: 90
    lines: 90
  
  apps/worker:
    statements: 80
    branches: 75
    functions: 80
    lines: 80
  
  apps/evaluator:
    statements: 85
    branches: 80
    functions: 85
    lines: 85

rules:
  - fail_ci_if_below_threshold: true
