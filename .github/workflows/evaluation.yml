name: Evaluation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'libs/domain/**'
      - 'libs/persistence/**'
      - 'apps/worker/**'
      - 'apps/api/**'
      - 'apps/evaluator/**'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Run Smoke Evaluation
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: razorpay_rr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/razorpay_rr_test?schema=public"
      TEST_DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/razorpay_rr_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      APP_ENV: "test"
      LLM_ENABLED: "false"
      RAZORPAY_MODE: "test"

    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-node-pnpm

      - name: Prisma DB Push (Test DB)
        run: pnpm --filter @rr/persistence exec prisma db push

      - name: Run Smoke Evaluation
        run: pnpm evaluate-smoke

      - name: Upload Sanitized Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            artifacts/summary.md
            artifacts/summary.json
            artifacts/metrics.json
            artifacts/metrics.csv
            artifacts/baseline-comparison.md
            artifacts/audit-integrity-report.json
            artifacts/reproducibility.json
          retention-days: 14
          if-no-files-found: ignore
