name: Resilience

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failure-demo:
    name: Run Failure & Recovery Demo
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: razorpay_rr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/razorpay_rr_test?schema=public"
      TEST_DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/razorpay_rr_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      APP_ENV: "test"
      LLM_ENABLED: "false"
      RAZORPAY_MODE: "test"

    steps:
      - name: Setup environment
        uses: ./.github/actions/setup-node-pnpm

      - name: Prisma DB Push (Test DB)
        run: pnpm --filter @rr/persistence exec prisma migrate deploy

      - name: Run Failure Demo
        run: pnpm failure-demo

      - name: Upload Sanitized Resilience Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-artifacts
          path: |
            artifacts/failure-demo-summary.md
            artifacts/scenario-results.json
            artifacts/metrics-before-after.json
            artifacts/reproducibility.json
          retention-days: 14
          if-no-files-found: ignore
