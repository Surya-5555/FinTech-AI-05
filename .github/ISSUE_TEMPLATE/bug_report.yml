name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: correlation-id
    attributes:
      label: Correlation ID
      description: If available, provide the correlation ID from the logs.
  - type: input
    id: case-id
    attributes:
      label: Case / Plan / Intervention ID
      description: Provide IDs only if they are synthetic/test IDs. Do not paste live IDs.
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this bug?
    validations:
      required: true
  - type: dropdown
    id: safety-impact
    attributes:
      label: Safety Impact
      description: Does this bug impact the safety or idempotency of financial operations?
      options:
        - "No"
        - "Yes, potential duplicate action"
        - "Yes, policy bypass"
    validations:
      required: true
  - type: checkboxes
    id: logs-redacted
    attributes:
      label: Logs Redacted
      options:
        - label: I confirm that any logs or payloads provided do not contain PII or live secrets.
          required: true
